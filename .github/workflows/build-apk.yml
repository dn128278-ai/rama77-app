name: Build Android APK from Web App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Bun and Dependencies
      run: |
        npm install -g bun
        bun install

    - name: Organize Files for Build
      run: |
        mkdir -p components/AndroidEmulator components/CodeExplorer components/AnalysisDoc components/AdminPanel utils
        [ -f PhoneFrame.tsx ] && mv PhoneFrame.tsx components/AndroidEmulator/
        [ -f CodeExplorer.tsx ] && mv CodeExplorer.tsx components/CodeExplorer/
        [ -f AnalysisReport.tsx ] && mv AnalysisReport.tsx components/AnalysisDoc/
        [ -f AdminPanel.tsx ] && mv AdminPanel.tsx components/AdminPanel/
        [ -f projectZipGenerator.ts ] && mv projectZipGenerator.ts utils/

    - name: Build Web Application
      run: bun run build

    - name: Setup Capacitor and Android
      run: |
        npx cap init RAMA77 com.rama77.app --web-dir dist --yes
        npx cap add android
        npx cap copy android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
