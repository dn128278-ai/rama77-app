name: Build Android APK from Web App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Bun and Dependencies
      run: |
        npm install -g bun
        bun install
        bun add @capacitor/core @capacitor/cli @capacitor/android

    - name: Organize Complete Directory Structure
      run: |
        mkdir -p components/AndroidEmulator components/CodeExplorer components/AnalysisDoc components/AdminPanel utils data
        
        [ -f CodeExplorer.tsx ] && mv CodeExplorer.tsx components/CodeExplorer/
        [ -f AnalysisReport.tsx ] && mv AnalysisReport.tsx components/AnalysisDoc/
        [ -f AdminPanel.tsx ] && mv AdminPanel.tsx components/AdminPanel/
        [ -f projectZipGenerator.ts ] && mv projectZipGenerator.ts utils/
        [ -f marketScheduleEngine.ts ] && mv marketScheduleEngine.ts utils/
        
        [ -f androidProjectFiles.ts ] && mv androidProjectFiles.ts data/
        [ -f mockData.ts ] && mv mockData.ts data/
        [ -f backendApiStore.ts ] && mv backendApiStore.ts data/
        
        [ -f nativeAlertStore.ts ] && mv nativeAlertStore.ts components/AndroidEmulator/
        [ -f PhoneFrame.tsx ] && mv PhoneFrame.tsx components/AndroidEmulator/
        [ -f DrawerMenu.tsx ] && mv DrawerMenu.tsx components/AndroidEmulator/
        [ -f MpinLoginScreen.tsx ] && mv MpinLoginScreen.tsx components/AndroidEmulator/
        [ -f RegisterScreen.tsx ] && mv RegisterScreen.tsx components/AndroidEmulator/
        [ -f HomeScreen.tsx ] && mv HomeScreen.tsx components/AndroidEmulator/
        [ -f FundsScreen.tsx ] && mv FundsScreen.tsx components/AndroidEmulator/
        [ -f PassBookScreen.tsx ] && mv PassBookScreen.tsx components/AndroidEmulator/PassbookScreen.tsx
        [ -f PassbookScreen.tsx ] && mv PassbookScreen.tsx components/AndroidEmulator/
        [ -f GameCenterScreen.tsx ] && mv GameCenterScreen.tsx components/AndroidEmulator/
        [ -f SubGameBetScreen.tsx ] && mv SubGameBetScreen.tsx components/AndroidEmulator/
        [ -f HistoryScreen.tsx ] && mv HistoryScreen.tsx components/AndroidEmulator/
        [ -f ChartsScreen.tsx ] && mv ChartsScreen.tsx components/AndroidEmulator/
        [ -f GameRatesScreen.tsx ] && mv GameRatesScreen.tsx components/AndroidEmulator/
        [ -f NotificationScreen.tsx ] && mv NotificationScreen.tsx components/AndroidEmulator/
        [ -f SupportScreen.tsx ] && mv SupportScreen.tsx components/AndroidEmulator/
        [ -f SettingsScreen.tsx ] && mv SettingsScreen.tsx components/AndroidEmulator/
        [ -f SecurityCenterScreen.tsx ] && mv SecurityCenterScreen.tsx components/AndroidEmulator/
        [ -f ChangeMpinScreen.tsx ] && mv ChangeMpinScreen.tsx components/AndroidEmulator/
        [ -f NativeAlertDialog.tsx ] && mv NativeAlertDialog.tsx components/AndroidEmulator/
        [ -f EmulatorModals.tsx ] && mv EmulatorModals.tsx components/AndroidEmulator/
        [ -f RootDetectionModal.tsx ] && mv RootDetectionModal.tsx components/AndroidEmulator/

    - name: Build Web Application
      run: bun run build

    - name: Setup Capacitor and Android
      run: |
        bunx cap init RAMA77 com.rama77.app --web-dir dist
        bunx cap add android
        bunx cap copy android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
